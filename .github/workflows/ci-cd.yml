name: DevOps Ultralearning CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Run Basic Lint / Test
      run: |
        echo "=== [1/2] Testing HTML structure ==="
        grep -q "<h1>" index.html && echo "HTML Test Passed!" || exit 1

    - name: Build Docker Image Test
      run: |
        echo "=== [2/2] Simulating Docker Build ==="
        echo "Building image for devops-ultralearning-pipeline..."
